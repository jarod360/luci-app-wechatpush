              menu = json.load(f)
          with open(sys.argv[2], encoding="utf-8") as f:
              acl = json.load(f)

          assert "admin/services/wechatpush" in menu, "LuCI menu entry is missing"
          assert "luci-app-wechatpush" in acl, "rpcd ACL group is missing"
          for page in ("config", "advanced", "client", "log"):
              assert f"admin/services/wechatpush/{page}" in menu, f"Menu page {page} is missing"
          print("IPK metadata, install hooks, menu JSON, ACL JSON and required files verified.")
          PY

      - name: Upload .ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-ipk-${{ matrix.target.name }}
          path: ${{ env.SDK_DIR }}/${{ steps.find_ipk.outputs.path }}
          if-no-files-found: error

