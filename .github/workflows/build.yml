        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**/*
 "$conffiles")" -eq 1
          test "$(grep -c '^[^#[:space:]]' "$conffiles")" -eq 1

          for required_file in \
            usr/share/luci/menu.d/luci-app-wechatpush.json \
            usr/share/rpcd/acl.d/luci-app-wechatpush.json \
            etc/config/wechatpush \
