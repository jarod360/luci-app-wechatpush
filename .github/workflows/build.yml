name: Build OpenWrt Packages

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PACKAGE_NAME: luci-app-wechatpush
  SDK_DIR: /home/runner/work/openwrt-sdk

permissions:
  contents: write

concurrency:
  group: wechatpush-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stop-stale-builds:
    name: Stop superseded builds
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message, 'maintenance: cleanup workflow history')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const current = Number(process.env.GITHUB_RUN_ID);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'build.yml', branch: 'master', per_page: 100
            });
            for (const run of runs) {
              if (run.id < current && run.status !== 'completed') {
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
                core.info(`Cancelled superseded run ${run.id}`);
              }
            }

  cleanup-history:
    name: Keep only the latest workflow run
    if: >-
      github.event_name == 'push' && startsWith(github.event.head_commit.message, 'maintenance: cleanup workflow history')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete older completed workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const keep = Number(process.env.GITHUB_RUN_ID);
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo, per_page: 100
            });
            runs.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
            if (!runs.length || runs[0].id !== keep)
              throw new Error('A newer run exists; no history was deleted.');
            const older = runs.filter(run => run.id !== keep);
            core.info(`Preserving current latest run ${keep}; deleting ${older.length} older runs.`);
            let removed = 0;
            for (const run of older) {
              if (run.status !== 'completed') {
                try {
                  await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
                } catch (error) {
                  // The run may already have completed while metadata was refreshing.
                  if (error.status !== 409 && error.status !== 422) throw error;
                }
              }
              for (let attempt = 0; ; attempt++) {
                try {
                  await github.rest.actions.deleteWorkflowRun({ ...context.repo, run_id: run.id });
                  break;
                } catch (error) {
                  if (![409, 422].includes(error.status) || attempt >= 29) throw error;
                  await new Promise(resolve => setTimeout(resolve, 1000));
                }
              }
              removed++;
              if (removed % 20 === 0) core.info(`Deleted ${removed}/${older.length}`);
            }
            const remaining = await github.rest.actions.listWorkflowRunsForRepo({ ...context.repo, per_page: 100 });
            if (remaining.data.total_count !== 1 || remaining.data.workflow_runs[0].id !== keep)
              throw new Error('Unexpected remaining runs; review concurrent activity.');
            await core.summary.addHeading('Workflow history cleaned')
              .addRaw(`Deleted ${removed} older runs. Retained latest run ${keep}. Release assets are unchanged.`)
              .write();

  validate:
    name: Validate source and presence logic
    if: >-
      github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'maintenance: cleanup workflow history')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          timeout 120s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update || echo "Some package indexes unavailable; using existing indexes"
          timeout 150s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y lua5.1 jq locales
          sudo locale-gen en_US.UTF-8
          python -m pip install 'lupa==2.8'
      - name: Check all scripts and templates
        run: |
          bash -n root/usr/share/wechatpush/wechatpush
          for file in root/etc/init.d/wechatpush root/etc/uci-defaults/luci-wechatpush root/usr/libexec/wechatpush-call tests/*.sh; do bash -n "$file"; done
          sh -n root/usr/share/wechatpush/tplink-monitor
          while IFS= read -r file; do luac5.1 -p "$file"; done < <(find root -name '*.lua')
          while IFS= read -r file; do node --check "$file"; done < <(find htdocs -name '*.js')
          while IFS= read -r file; do jq -e . "$file" >/dev/null; done < <(find root -name '*.json')
      - name: Test protocol, UI and original detectors
        run: |
          python tests/test_ip2region.py
          python tests/test_tplink.py
          node tests/test_tplink_ui.js
          node tests/test_client_names.js
          bash tests/test_name_hints.sh
          bash tests/test_tplink_down.sh
          bash tests/test_login_notifications.sh
          bash tests/test_offline_parameters.sh
          bash tests/test_device_aliases.sh
          bash tests/test_utf8.sh
          bash tests/test_command_substitution_utf8.sh
          bash tests/test_template_utf8.sh
          bash tests/test_push_concurrency.sh
          bash tests/test_runtime_edges.sh

  build-apk:
    name: Build APK (v25.12)
    timeout-minutes: 25
    needs: validate
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: 'v25.12.0-rc1'
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: all
            path: x86/64

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          timeout 120s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update || echo "Some package indexes unavailable; using existing indexes"
          timeout 150s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y build-essential rsync unzip zstd lua5.1 python3 python3-pyelftools

      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_DIR }}
          key: ${{ runner.os }}-sdk-apk-${{ matrix.target.name }}-${{ env.OPENWRT_VERSION }}

      - name: Download, extract OpenWrt SDK and update feeds
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          release_version="${OPENWRT_VERSION#v}"
          sdk_url_prefix="https://downloads.openwrt.org/releases/${release_version}/targets/${{ matrix.target.path }}"
          
          sdk_filename=$(curl -s "$sdk_url_prefix/" | \
                        grep -o '<a href="openwrt-sdk-.*-x86_64\.tar\.\(xz\|zst\)">' | \
                        sed -e 's/.*<a href="//' -e 's/">//' | \
                        head -n 1)

          if [ -z "$sdk_filename" ]; then
            echo "::error::Could not find SDK file at ${sdk_url_prefix}/"
            echo "Available files:"
            curl -s "$sdk_url_prefix/" | grep -o '<a href="[^"]*">[^<]*</a>' | sed -e 's/<a href="\(.*\)".*>\(.*\)/\1\t\2/'
            exit 1
          fi
          
          echo "Downloading SDK: ${sdk_url_prefix}/${sdk_filename}"
          wget -q "${sdk_url_prefix}/${sdk_filename}"
          
          echo "Extracting SDK..."
          tar -xf "$sdk_filename"
          mv $(find . -maxdepth 1 -type d -name 'openwrt-sdk-*') ${{ env.SDK_DIR }}

          echo "Updating feeds..."
          cd ${{ env.SDK_DIR }}
          
          echo "Original feeds configuration:"
          cat feeds.conf.default
          
          max_retries=5
          retry_count=0
          while [ $retry_count -lt $max_retries ]; do
            echo "Attempt $((retry_count + 1)) of $max_retries to update feeds..."
            
            echo "Replacing feeds URLs with GitHub mirrors..."
            sed -i 's|https://git.openwrt.org/openwrt/openwrt.git|https://github.com/openwrt/openwrt.git|g' feeds.conf.default
            sed -i 's|https://git.openwrt.org/feed/packages.git|https://github.com/openwrt/packages.git|g' feeds.conf.default
            sed -i 's|https://git.openwrt.org/project/luci.git|https://github.com/openwrt/luci.git|g' feeds.conf.default
            sed -i 's|https://git.openwrt.org/feed/routing.git|https://github.com/openwrt/routing.git|g' feeds.conf.default
            sed -i 's|https://git.openwrt.org/feed/telephony.git|https://github.com/openwrt/telephony.git|g' feeds.conf.default
            
            if [ $retry_count -eq 0 ]; then
              echo "Updated feeds configuration:"
              cat feeds.conf.default
            fi
            
            if ./scripts/feeds update -a; then
              echo "Feeds update successful"
              break
            else
              retry_count=$((retry_count + 1))
              if [ $retry_count -lt $max_retries ]; then
                wait_time=$((60 * retry_count))
                echo "Feeds update failed, waiting ${wait_time} seconds before retry..."
                sleep $wait_time
              else
                echo "::error::Feeds update failed after $max_retries attempts"
                exit 1
              fi
            fi
          done
          
          ./scripts/feeds install -a
          cd ..

      - name: Prepare build environment
        working-directory: ${{ env.SDK_DIR }}
        run: |
          rm -rf package/${PACKAGE_NAME}
          src_dir="${{ github.workspace }}"
          if [ -f "$src_dir/Makefile" ]; then
            pkg_src="$src_dir"
          else
            pkg_src=$(find "$src_dir" -maxdepth 1 -type d -name "${PACKAGE_NAME}" -o -name "luci-app-*${PACKAGE_NAME#luci-app-}*" | head -n 1)
            if [ -z "$pkg_src" ]; then
              echo "::error::Could not locate package directory for ${PACKAGE_NAME}"
              exit 1
            fi
          fi
          mkdir -p ./package/${PACKAGE_NAME}
          rsync -a --delete "$pkg_src"/ ./package/${PACKAGE_NAME}/
          
          # Legacy third-party traffic monitoring was removed.
          # Optional QWRT-native statistics are configured at runtime.
          
          translation_pkg=${PACKAGE_NAME#luci-app-}
          mkdir -p ./bin/packages
          find ./bin/packages -type f -name "${PACKAGE_NAME}*.apk" -delete
          find ./bin/packages -type f -name "luci-i18n-${translation_pkg}-*.apk" -delete
          {
            echo "CONFIG_PACKAGE_${PACKAGE_NAME}=m"
            echo "CONFIG_PACKAGE_${PACKAGE_NAME}_Enable_Local_Disk_Information_Detection=y"
            echo "CONFIG_PACKAGE_${PACKAGE_NAME}_Enable_Host_Information_Detection=y"
            echo "CONFIG_PACKAGE_lsblk=m"
            echo "CONFIG_PACKAGE_smartmontools=m"
            echo "CONFIG_PACKAGE_smartmontools-drivedb=m"
            echo "CONFIG_PACKAGE_openssh-client=m"
            echo "CONFIG_PACKAGE_openssh-keygen=m"
            echo "CONFIG_PACKAGE_luci-i18n-${translation_pkg}-zh-cn=m"
            echo "CONFIG_LUCI_LANG_zh_Hans=y"
          } > .config
          make defconfig

      - name: Compile the package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          make package/${PACKAGE_NAME}/compile V=s -j$(($(nproc) + 1))

      - name: Find and prepare .apk file
        id: find_apk
        working-directory: ${{ env.SDK_DIR }}
        run: |
          translation_pkg=${PACKAGE_NAME#luci-app-}
          rm -rf upload
          mkdir -p upload
          find ./bin/packages -type f \( -name "${PACKAGE_NAME}*.apk" -o -name "luci-i18n-${translation_pkg}-*.apk" -o -name "lsblk*.apk" -o -name "smartmontools*.apk" -o -name "openssh-client*.apk" -o -name "openssh-keygen*.apk" \) | while read -r apk; do
            rel_path=${apk#./}
            echo "Found apk: $rel_path"
            cp "$apk" upload/
          done
          if ! find upload -maxdepth 1 -type f -name '*.apk' | grep -q '.'; then
            echo "::error::No apk files found in ./bin/packages/"
            echo "Directory tree of ./bin/:"
            ls -R ./bin/
            exit 1
          fi
          echo "path=upload" >> $GITHUB_OUTPUT

      - name: Upload .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-apk-${{ matrix.target.name }}
          path: ${{ env.SDK_DIR }}/${{ steps.find_apk.outputs.path }}
          if-no-files-found: error

  build-ipk:
    name: Build IPK (v23.05)
    timeout-minutes: 25
    needs: validate
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: 'v23.05.3'
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: all
            path: x86/64

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          timeout 120s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update || echo "Some package indexes unavailable; using existing indexes"
          timeout 150s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y build-essential rsync unzip zstd lua5.1 python3

      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_DIR }}
          key: ${{ runner.os }}-sdk-ipk-${{ matrix.target.name }}-${{ env.OPENWRT_VERSION }}

      - name: Download, extract OpenWrt SDK and update feeds
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          release_version="${OPENWRT_VERSION#v}"
          sdk_url_prefix="https://downloads.openwrt.org/releases/${release_version}/targets/${{ matrix.target.path }}"
          
          sdk_filename=$(curl -s "$sdk_url_prefix/" | \
                        grep -o '<a href="openwrt-sdk-.*-x86_64\.tar\.\(xz\|zst\)">' | \
                        sed -e 's/.*<a href="//' -e 's/">//' | \
                        head -n 1)

          if [ -z "$sdk_filename" ]; then
            echo "::error::Could not find SDK file at ${sdk_url_prefix}/"
            echo "Available files:"
            curl -s "$sdk_url_prefix/" | grep -o '<a href="[^"]*">[^<]*</a>' | sed -e 's/<a href="\(.*\)".*>\(.*\)/\1\t\2/'
            exit 1
          fi
          
          echo "Downloading SDK: ${sdk_url_prefix}/${sdk_filename}"
          wget -q "${sdk_url_prefix}/${sdk_filename}"
          
          echo "Extracting SDK..."
          tar -xf "$sdk_filename"
          mv $(find . -maxdepth 1 -type d -name 'openwrt-sdk-*') ${{ env.SDK_DIR }}

          echo "Updating feeds..."
          cd ${{ env.SDK_DIR }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cd ..

      - name: Prepare build environment
        working-directory: ${{ env.SDK_DIR }}
        run: |
          rm -rf package/${PACKAGE_NAME}
          src_dir="${{ github.workspace }}"
          if [ -f "$src_dir/Makefile" ]; then
            pkg_src="$src_dir"
          else
            pkg_src=$(find "$src_dir" -maxdepth 1 -type d -name "${PACKAGE_NAME}" -o -name "luci-app-*${PACKAGE_NAME#luci-app-}*" | head -n 1)
            if [ -z "$pkg_src" ]; then
              echo "::error::Could not locate package directory for ${PACKAGE_NAME}"
              exit 1
            fi
          fi
          mkdir -p ./package/${PACKAGE_NAME}
          rsync -a --delete "$pkg_src"/ ./package/${PACKAGE_NAME}/
          translation_pkg=${PACKAGE_NAME#luci-app-}
          mkdir -p ./bin/packages
          find ./bin/packages -type f -name "${PACKAGE_NAME}*.ipk" -delete
          find ./bin/packages -type f -name "luci-i18n-${translation_pkg}-*.ipk" -delete
          {
            echo "CONFIG_PACKAGE_${PACKAGE_NAME}=m"
            echo "CONFIG_PACKAGE_luci-i18n-${translation_pkg}-zh-cn=m"
            echo "CONFIG_LUCI_LANG_zh_Hans=y"
          } > .config
          make defconfig

      - name: Compile the package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          # The 23.05 LuCI recipe ignores PKG_RELEASE in its package VERSION.
          # Include the revision only in this package copy for the legacy SDK.
          version=$(sed -n 's/^PKG_VERSION:=//p' "${{ github.workspace }}/Makefile")
          revision=$(sed -n 's/^PKG_RELEASE:=//p' "${{ github.workspace }}/Makefile")
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${version}-r${revision}/" "package/${PACKAGE_NAME}/Makefile"
          make package/${PACKAGE_NAME}/compile V=s -j$(($(nproc) + 1))
          python3 "${{ github.workspace }}/tests/check_ipk.py" ./bin/packages "${{ github.workspace }}"

      - name: Find and prepare .ipk file
        id: find_ipk
        working-directory: ${{ env.SDK_DIR }}
        run: |
          translation_pkg=${PACKAGE_NAME#luci-app-}
          rm -rf upload
          mkdir -p upload
          find ./bin/packages -type f \( -name "${PACKAGE_NAME}*.ipk" -o -name "luci-i18n-${translation_pkg}-*.ipk" \) | while read -r ipk; do
            rel_path=${ipk#./}
            echo "Found IPK: $rel_path"
            cp "$ipk" upload/
          done
          if ! find upload -maxdepth 1 -type f -name '*.ipk' | grep -q '.'; then
            echo "::error::No IPK files found in ./bin/packages/"
            echo "Directory tree of ./bin/:"
            ls -R ./bin/
            exit 1
          fi
          echo "path=upload" >> $GITHUB_OUTPUT

      - name: Upload .ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-ipk-${{ matrix.target.name }}
          path: ${{ env.SDK_DIR }}/${{ steps.find_ipk.outputs.path }}
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-apk, build-ipk]
    if: >-
      startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'release: v'))
    steps:
      - uses: actions/checkout@v4
      - name: Prepare version and release notes
        id: release-meta
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(sed -n 's/^PKG_VERSION:=//p' Makefile)
            tag="v${version}"
            revision=$(sed -n 's/^PKG_RELEASE:=//p' Makefile)
            if [ "${revision:-1}" -gt 1 ]; then tag="${tag}-r${revision}"; fi
            # Only an explicit release commit may create a version from master.
            expected=$(git log -1 --format=%s | awk '{print $2}')
            [ "$expected" = "$tag" ] || { echo 'Release commit/version mismatch'; exit 1; }
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then cp "$notes" RELEASE_NOTES.md; else printf 'See README for usage and changes.\n' > RELEASE_NOTES.md; fi
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag_name }}
          name: ${{ steps.release-meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: release-assets/**/*
